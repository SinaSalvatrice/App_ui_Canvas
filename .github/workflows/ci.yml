name: Flutter CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform hosts
        shell: pwsh
        run: ./tool/bootstrap_platform_hosts.ps1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
